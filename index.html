<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOMS V8.0 — CITY WATER | Water Operations Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cw-navy: #07263b;
      --cw-teal: #0b6e8a;
      --cw-aqua: #1496b5;
      --cw-sand: #f4efe6;
    }

    body {
      font-family: 'Cairo', 'Inter', sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at 12% 8%, rgba(20, 150, 181, 0.24), transparent 36%),
        radial-gradient(circle at 88% 14%, rgba(245, 158, 11, 0.14), transparent 34%),
        linear-gradient(165deg, #e7f5f9 0%, #d8eef5 42%, #eef6f8 76%, #f8f5ee 100%);
      color: #0b2234;
      overflow-x: hidden;
    }

    html[lang="en"] body {
      font-family: 'Inter', 'Cairo', sans-serif;
    }

    /* Subtle coastal wave layer */
    .coastal-backdrop {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        linear-gradient(to top, rgba(7, 38, 59, 0.05) 0%, transparent 28%),
        repeating-linear-gradient(
          -18deg,
          rgba(11, 110, 138, 0.025) 0px,
          rgba(11, 110, 138, 0.025) 2px,
          transparent 2px,
          transparent 28px
        );
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(11, 110, 138, 0.16);
      box-shadow: 0 12px 32px -12px rgba(7, 38, 59, 0.14);
    }

    .brand-hero-card {
      background: linear-gradient(125deg, #051e30 0%, #094863 55%, #0e7c96 100%);
      box-shadow: 0 16px 36px -14px rgba(5, 30, 48, 0.45);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(11, 110, 138, 0.35);
      border-radius: 9999px;
    }

    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background: #ffffff !important;
      }
      .glass-panel, .brand-hero-card {
        box-shadow: none !important;
        border: 1px solid #cbd5e1 !important;
      }
    }
  </style>
</head>
<body class="relative antialiased selection:bg-cyan-200 selection:text-slate-900">
  <div class="coastal-backdrop no-print"></div>

  <!-- Toast / Status Banner Container -->
  <div id="toastBanner" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 hidden max-w-md w-full px-4 no-print">
    <div id="toastBox" class="rounded-2xl px-4 py-3 text-sm font-bold text-white shadow-xl flex items-center justify-between gap-3 bg-slate-900">
      <span id="toastText"></span>
      <button onclick="hideToast()" class="text-white/80 hover:text-white text-xs px-2 py-1 rounded-lg bg-white/10">✕</button>
    </div>
  </div>

  <!-- Main Application Shell -->
  <div id="appRoot" class="relative z-10 min-h-screen flex flex-col">
    <!-- Top Header Bar -->
    <header class="sticky top-0 z-30 glass-panel border-b border-cyan-900/15 no-print">
      <div class="max-w-[1440px] mx-auto px-3 sm:px-6 py-2.5 flex flex-wrap items-center justify-between gap-3">
        <!-- Prominent CITY WATER Emblem & Identity -->
        <div class="flex items-center gap-3.5">
          <div id="customLogoSlot" class="w-14 h-14 sm:w-16 sm:h-16 rounded-2xl bg-gradient-to-br from-sky-900 via-cyan-800 to-teal-600 p-1.5 shadow-lg border border-cyan-300/40 flex items-center justify-center shrink-0">
            <svg viewBox="0 0 120 120" class="w-full h-full" aria-label="CITY WATER Logo">
              <defs>
                <linearGradient id="cwDropGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0%" stop-color="#7dd3fc" />
                  <stop offset="55%" stop-color="#06b6d4" />
                  <stop offset="100%" stop-color="#0284c7" />
                </linearGradient>
                <linearGradient id="cwWaveGrad" x1="0" y1="0" x2="1" y2="0">
                  <stop offset="0%" stop-color="#fde68a" />
                  <stop offset="100%" stop-color="#38bdf8" />
                </linearGradient>
              </defs>
              <circle cx="60" cy="60" r="55" fill="#06283d" stroke="url(#cwWaveGrad)" stroke-width="3" />
              <path d="M60 22 C60 22, 33 54, 33 72 C33 87.5, 45.1 99, 60 99 C74.9 99, 87 87.5, 87 72 C87 54, 60 22, 60 22 Z" fill="url(#cwDropGrad)" />
              <path d="M22 76 Q36 68 50 76 T78 76 T100 74" fill="none" stroke="url(#cwWaveGrad)" stroke-width="4" stroke-linecap="round" />
              <text x="60" y="111" text-anchor="middle" fill="#e0f2fe" font-size="11" font-weight="800" letter-spacing="1.2">CITY WATER</text>
            </svg>
          </div>
          <div>
            <div class="flex items-center gap-2 flex-wrap">
              <span id="hdrCompanyName" class="text-lg sm:text-2xl font-black tracking-tight text-sky-950"></span>
              <span class="px-2.5 py-0.5 text-xs font-extrabold rounded-full bg-cyan-700 text-white shadow-sm">WOMS V8.0</span>
              <span class="hidden md:inline-flex px-2 py-0.5 text-[11px] font-bold rounded-full bg-amber-100 text-amber-900 border border-amber-300" id="hdrEstBadge"></span>
            </div>
            <p id="hdrTagline" class="text-xs text-slate-600 font-semibold"></p>
            <p id="hdrAddressLine" class="text-[11px] text-slate-500 hidden sm:block"></p>
          </div>
        </div>

        <!-- Right Controls: Active Session, News Drawer Toggle, Print, AR/EN Switcher -->
        <div class="flex items-center gap-2 flex-wrap">
          <div id="sessionBadge" class="hidden items-center gap-2 px-3 py-1.5 rounded-xl bg-sky-950 text-cyan-50 text-xs font-bold">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span id="sessionRoleLabel"></span>
            <button onclick="logoutSession()" class="ms-1 px-2 py-0.5 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold" id="btnLogoutText"></button>
          </div>

          <button onclick="toggleNewsSidebar()" class="px-3 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 text-xs font-extrabold shadow-sm flex items-center gap-1.5 transition">
            <span>📰</span>
            <span id="btnNewsToggleText"></span>
          </button>

          <button onclick="window.print()" class="px-3 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold shadow-sm flex items-center gap-1.5 transition">
            <span>🖨️</span>
            <span id="btnPrintText"></span>
          </button>

          <button onclick="toggleLanguage()" class="px-3.5 py-2 rounded-xl bg-cyan-700 hover:bg-cyan-800 text-white text-xs font-black shadow-sm border border-cyan-400/40 transition flex items-center gap-1.5">
            <span>🌐</span>
            <span id="btnLangText">EN</span>
          </button>
        </div>
      </div>
    </header>

    <!-- Hero Banner with Coastal / Tourism / Desalination Theme -->
    <section class="max-w-[1440px] w-full mx-auto px-3 sm:px-6 pt-4 no-print">
      <div class="brand-hero-card rounded-3xl p-5 sm:p-7 text-white relative overflow-hidden">
        <div class="relative z-10 flex flex-col lg:flex-row lg:items-center lg:justify-between gap-5">
          <div class="max-w-3xl">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 border border-white/25 text-xs font-bold text-cyan-100 mb-2">
              <span>🌊</span>
              <span id="heroCoastBadge"></span>
            </div>
            <h1 id="heroTitle" class="text-2xl sm:text-3xl font-black leading-tight"></h1>
            <p id="heroSubtitle" class="text-sm text-cyan-100/90 mt-1.5 leading-relaxed"></p>
            <div class="mt-3 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-amber-200 font-semibold" id="heroContactRow"></div>
          </div>

          <!-- Quick KPI Strip -->
          <div class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-2 gap-2.5 shrink-0" id="heroKpiGrid"></div>
        </div>
      </div>
    </section>

    <!-- Main Workspace Body + Vertical Sidebar for CITY WATER News / Projects / Rewards / Regulations -->
    <main class="max-w-[1440px] w-full mx-auto px-3 sm:px-6 py-5 flex-1 flex flex-col lg:flex-row gap-5 items-start">
      <!-- Primary Content Column -->
      <div class="flex-1 w-full min-w-0 space-y-5">
        <!-- Login / Access Selector Card (When not logged in) -->
        <div id="authPanel" class="glass-panel rounded-3xl p-5 sm:p-6">
          <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-4 border-b border-slate-200">
            <div>
              <h2 id="authTitle" class="text-xl font-black text-sky-950"></h2>
              <p id="authSubtitle" class="text-xs text-slate-600 mt-0.5"></p>
            </div>
            <div class="flex flex-wrap gap-2">
              <button onclick="switchAuthTab('operator')" id="tabAuthOperator" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-cyan-700 text-white shadow-sm"></button>
              <button onclick="switchAuthTab('ops')" id="tabAuthOps" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-slate-200 text-slate-800 hover:bg-slate-300"></button>
              <button onclick="switchAuthTab('ceo')" id="tabAuthCeo" class="px-4 py-2 rounded-xl text-xs font-extrabold bg-amber-500 text-slate-950 hover:bg-amber-600"></button>
            </div>
          </div>

          <!-- Operator Phone + Password Form -->
          <form id="operatorLoginForm" onsubmit="handleOperatorLogin(event)" class="mt-5 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div>
              <label id="lblOpPhone" class="block text-xs font-extrabold text-slate-700 mb-1.5"></label>
              <input id="opPhoneInput" type="tel" required placeholder="010..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold focus:ring-2 focus:ring-cyan-600 outline-none" />
            </div>
            <div>
              <label id="lblOpPass" class="block text-xs font-extrabold text-slate-700 mb-1.5"></label>
              <input id="opPassInput" type="password" required placeholder="1234" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold focus:ring-2 focus:ring-cyan-600 outline-none" />
            </div>
            <div>
              <button type="submit" id="btnOpLoginSubmit" class="w-full py-2.5 px-4 rounded-xl bg-gradient-to-r from-cyan-700 to-teal-700 hover:from-cyan-800 hover:to-teal-800 text-white text-sm font-black shadow-md transition"></button>
            </div>
            <div class="md:col-span-3 flex flex-wrap items-center justify-between gap-2 text-xs text-slate-600 bg-cyan-50/80 border border-cyan-200 rounded-2xl px-4 py-2.5">
              <span id="opLoginHintText"></span>
              <span class="font-bold text-cyan-900" id="opDefaultPassBadge"></span>
            </div>
          </form>

          <!-- PIN Login Form for Operations Manager or CEO -->
          <form id="pinLoginForm" onsubmit="handlePinLogin(event)" class="hidden mt-5 grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
            <div class="md:col-span-2">
              <label id="lblPinInput" class="block text-xs font-extrabold text-slate-700 mb-1.5"></label>
              <input id="pinCodeInput" type="password" required placeholder="2026" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold focus:ring-2 focus:ring-amber-500 outline-none" />
              <p id="pinHintText" class="text-[11px] text-slate-500 mt-1"></p>
            </div>
            <div>
              <button type="submit" id="btnPinLoginSubmit" class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-950 text-white text-sm font-black shadow-md transition"></button>
            </div>
          </form>

          <!-- Quick Directory Preview of Operators (Helpful reference while testing) -->
          <div class="mt-5 pt-4 border-t border-slate-200/80">
            <div class="flex items-center justify-between mb-2">
              <span id="opDirectoryTitle" class="text-xs font-extrabold text-slate-700"></span>
              <span id="opDirectoryCount" class="text-[11px] font-bold text-cyan-800"></span>
            </div>
            <div id="opQuickChips" class="flex flex-wrap gap-1.5 max-h-24 overflow-y-auto custom-scroll p-1"></div>
          </div>
        </div>

        <!-- Logged-In Workspace -->
        <div id="workspacePanel" class="hidden space-y-5">
          <!-- Navigation Tabs -->
          <nav id="moduleNav" class="glass-panel rounded-2xl p-2 flex flex-wrap gap-1.5 no-print"></nav>

          <!-- TAB 1: STATIONS & OPERATORS (12 Stations + QR + 20 Operators) -->
          <section id="tab-stations" class="space-y-5">
            <!-- Stations Header & Quick Add -->
            <div class="glass-panel rounded-3xl p-5">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                  <h2 id="stationsHeading" class="text-xl font-black text-sky-950"></h2>
                  <p id="stationsSubheading" class="text-xs text-slate-600"></p>
                </div>
                <div id="adminStationActions" class="flex flex-wrap gap-2">
                  <button onclick="openAddStationModal()" id="btnAddStation" class="px-3.5 py-2 rounded-xl bg-cyan-700 hover:bg-cyan-800 text-white text-xs font-extrabold shadow-sm"></button>
                </div>
              </div>

              <!-- Filter Pills -->
              <div class="flex flex-wrap gap-2 mb-4" id="stationFilterPills"></div>

              <!-- 12 Stations Grid -->
              <div id="stationsGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
            </div>

            <!-- 20 Operators Management Card -->
            <div id="operatorsSectionCard" class="glass-panel rounded-3xl p-5">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
                <div>
                  <h3 id="operatorsHeading" class="text-lg font-black text-sky-950"></h3>
                  <p id="operatorsSubheading" class="text-xs text-slate-600"></p>
                </div>
                <button onclick="addNewOperatorRow()" id="btnAddOperator" class="px-3.5 py-2 rounded-xl bg-teal-700 hover:bg-teal-800 text-white text-xs font-extrabold"></button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-xs border-collapse">
                  <thead>
                    <tr class="bg-sky-950 text-white">
                      <th class="p-2.5 text-start rounded-ts-xl" id="thOpName"></th>
                      <th class="p-2.5 text-start" id="thOpPhone"></th>
                      <th class="p-2.5 text-start" id="thOpPass"></th>
                      <th class="p-2.5 text-start" id="thOpStation"></th>
                      <th class="p-2.5 text-start rounded-te-xl" id="thOpActions"></th>
                    </tr>
                  </thead>
                  <tbody id="operatorsTableBody" class="divide-y divide-slate-200 bg-white/80"></tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- TAB 2: 5-TIER OPERATIONAL READINGS & 15-MIN LOCK -->
          <section id="tab-readings" class="hidden space-y-5">
            <div class="glass-panel rounded-3xl p-5">
              <div class="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-4 border-b border-slate-200">
                <div>
                  <h2 id="readingsHeading" class="text-xl font-black text-sky-950"></h2>
                  <p id="readingsSubheading" class="text-xs text-slate-600"></p>
                </div>
                <div class="flex flex-wrap items-center gap-2">
                  <label class="text-xs font-bold text-slate-700" id="lblSelectReadingStation"></label>
                  <select id="readingStationSelect" onchange="onReadingStationChange()" class="px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-extrabold"></select>
                </div>
              </div>

              <!-- 5-Tier Selector -->
              <div class="mt-4 grid grid-cols-2 sm:grid-cols-5 gap-2" id="tierButtonsGrid"></div>

              <!-- Dynamic Reading Form -->
              <form id="readingEntryForm" onsubmit="saveReadingEntry(event)" class="mt-5 space-y-4">
                <div id="readingTierFields" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4"></div>

                <!-- Mandatory Per-Vessel TDS Panel when Permeate TDS Exceeds Limit -->
                <div id="vesselExceedPanel" class="hidden rounded-2xl border-2 border-rose-500 bg-rose-50 p-4 space-y-3">
                  <div class="flex items-center justify-between flex-wrap gap-2">
                    <span id="vesselExceedTitle" class="text-sm font-black text-rose-800"></span>
                    <span id="vesselExceedBadge" class="px-2.5 py-0.5 rounded-full bg-rose-600 text-white text-[11px] font-bold"></span>
                  </div>
                  <p id="vesselExceedDesc" class="text-xs text-rose-700 font-semibold"></p>
                  <div id="vesselInputsGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2.5"></div>
                </div>

                <!-- Live Calculated Metrics Strip -->
                <div id="liveCalcStrip" class="grid grid-cols-1 sm:grid-cols-3 gap-3 bg-sky-950 text-white rounded-2xl p-4">
                  <div>
                    <div class="text-[11px] text-cyan-200 font-semibold" id="calcRecoveryLabel"></div>
                    <div id="calcRecoveryVal" class="text-lg font-black text-emerald-300 mt-0.5">--</div>
                  </div>
                  <div>
                    <div class="text-[11px] text-cyan-200 font-semibold" id="calcRejectTdsLabel"></div>
                    <div id="calcRejectTdsVal" class="text-lg font-black text-amber-300 mt-0.5">--</div>
                  </div>
                  <div>
                    <div class="text-[11px] text-cyan-200 font-semibold" id="calcDailyNetLabel"></div>
                    <div id="calcDailyNetVal" class="text-lg font-black text-cyan-300 mt-0.5">--</div>
                  </div>
                </div>

                <!-- Optional GPS & Photo Verification with Skip Option -->
                <div class="rounded-2xl border border-slate-200 bg-slate-50/90 p-4 space-y-3">
                  <div class="flex flex-wrap items-center justify-between gap-2">
                    <span id="verifyMediaTitle" class="text-xs font-extrabold text-slate-800"></span>
                    <button type="button" onclick="skipVerificationMedia()" id="btnSkipVerify" class="px-3 py-1 rounded-lg bg-slate-200 hover:bg-slate-300 text-slate-800 text-xs font-bold"></button>
                  </div>
                  <div class="grid grid-cols-1 md:grid-cols-2 gap-3 items-center">
                    <div class="flex flex-wrap items-center gap-2">
                      <button type="button" onclick="captureGpsLocation()" id="btnCaptureGps" class="px-3.5 py-2 rounded-xl bg-cyan-700 hover:bg-cyan-800 text-white text-xs font-bold"></button>
                      <span id="gpsStatusLabel" class="text-xs font-semibold text-slate-600"></span>
                    </div>
                    <div class="flex flex-wrap items-center gap-2">
                      <input id="photoFileInput" type="file" accept="image/*" onchange="handlePhotoSelected(event)" class="text-xs text-slate-700 file:mr-2 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-sky-900 file:text-white" />
                      <span id="photoStatusLabel" class="text-xs font-semibold text-slate-600"></span>
                    </div>
                  </div>
                </div>

                <div class="flex flex-wrap items-center justify-end gap-3">
                  <button type="submit" id="btnSaveReading" class="px-6 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-sm font-black shadow-md"></button>
                </div>
              </form>
            </div>

            <!-- Saved Readings Log with 15-Minute Edit Lock -->
            <div class="glass-panel rounded-3xl p-5">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-3">
                <h3 id="readingsLogHeading" class="text-lg font-black text-sky-950"></h3>
                <span id="lockPolicyNote" class="text-xs font-bold text-amber-800 bg-amber-100 px-3 py-1 rounded-full"></span>
              </div>
              <div id="readingsHistoryList" class="space-y-2.5 max-h-96 overflow-y-auto custom-scroll"></div>
            </div>
          </section>

          <!-- TAB 3: CEO EXECUTIVE OVERVIEW (PIN 2026 + Charts + All 12 Stations) -->
          <section id="tab-ceo" class="hidden space-y-5">
            <div class="glass-panel rounded-3xl p-5 space-y-5">
              <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-200 pb-4">
                <div>
                  <span class="px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-900 text-[11px] font-black">CEO EXECUTIVE REPORT</span>
                  <h2 id="ceoHeading" class="text-xl sm:text-2xl font-black text-sky-950 mt-1"></h2>
                  <p id="ceoSubheading" class="text-xs text-slate-600"></p>
                </div>
                <div class="flex gap-2 no-print">
                  <button onclick="window.print()" id="btnCeoPrint" class="px-4 py-2 rounded-xl bg-sky-950 hover:bg-slate-900 text-white text-xs font-extrabold"></button>
                </div>
              </div>

              <!-- Executive Financial & Production KPIs -->
              <div id="ceoKpiCards" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3.5"></div>

              <!-- SVG Charts Row: Production by Station & Financial Margin -->
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div class="rounded-2xl border border-slate-200 bg-white p-4">
                  <h3 id="chartProdTitle" class="text-sm font-black text-sky-950 mb-3"></h3>
                  <div id="svgProductionChart" class="w-full overflow-x-auto"></div>
                </div>
                <div class="rounded-2xl border border-slate-200 bg-white p-4">
                  <h3 id="chartFinTitle" class="text-sm font-black text-sky-950 mb-3"></h3>
                  <div id="svgFinancialChart" class="w-full overflow-x-auto"></div>
                </div>
              </div>

              <!-- Full Overview Table of All 12 Stations -->
              <div>
                <h3 id="ceoAllStationsTitle" class="text-base font-black text-sky-950 mb-3"></h3>
                <div class="overflow-x-auto">
                  <table class="w-full text-xs border-collapse">
                    <thead>
                      <tr class="bg-sky-950 text-white">
                        <th class="p-2.5 text-start rounded-ts-xl" id="thCeoCode"></th>
                        <th class="p-2.5 text-start" id="thCeoName"></th>
                        <th class="p-2.5 text-start" id="thCeoSector"></th>
                        <th class="p-2.5 text-start" id="thCeoStatus"></th>
                        <th class="p-2.5 text-start" id="thCeoCap"></th>
                        <th class="p-2.5 text-start" id="thCeoActual"></th>
                        <th class="p-2.5 text-start" id="thCeoRev"></th>
                        <th class="p-2.5 text-start rounded-te-xl" id="thCeoProfit"></th>
                      </tr>
                    </thead>
                    <tbody id="ceoStationsTableBody" class="divide-y divide-slate-200 bg-white"></tbody>
                  </table>
                </div>
              </div>
            </div>
          </section>

          <!-- TAB 4: RO ENGINEERING DESIGN CALCULATOR -->
          <section id="tab-design" class="hidden space-y-5">

    function showToast(msg, type = "info") {
      const banner = document.getElementById("toastBanner");
      const box = document.getElementById("toastBox");
      const text = document.getElementById("toastText");
      text.textContent = msg;
      box.className = "rounded-2xl px-4 py-3 text-sm font-bold text-white shadow-xl flex items-center justify-between gap-3 " +
        (type === "error" ? "bg-rose-700" : type === "success" ? "bg-emerald-700" : "bg-sky-950");
      banner.classList.remove("hidden");
      clearTimeout(window.__toastTimer);
      window.__toastTimer = setTimeout(() => hideToast(), 3600);
    }

    function hideToast() {
      document.getElementById("toastBanner").classList.add("hidden");
    }

    function openStationQrModal(code) {
      const st = getStationByCode(code);
      const deepUrl = `${window.location.origin}${window.location.pathname}?station=${encodeURIComponent(st.code)}`;
      // Deterministic crisp SVG matrix representation for station deep-link QR
      const cells = [];
      let hash = 0;
      for (let i = 0; i < deepUrl.length; i++) hash = ((hash << 5) - hash) + deepUrl.charCodeAt(i);
      const gridSize = 11;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const isCorner = (r < 3 && c < 3) || (r < 3 && c >= gridSize - 3) || (r >= gridSize - 3 && c < 3);
          const bit = isCorner ? ((r === 0 || r === 2 || c === 0 || c === 2) || (r === 1 && c === 1)) : (((hash + r * 17 + c * 31) & 3) === 0);
          if (bit) {
            cells.push(`<rect x="${c * 14 + 10}" y="${r * 14 + 10}" width="12" height="12" rx="2" fill="#07263b" />`);
          }
        }
      }
      openModal(
        `${t("qrBtn")} — ${stationDisplayName(st)}`,
        `
        <div class="flex flex-col items-center text-center gap-3">
          <div class="p-3 rounded-2xl border-2 border-sky-950 bg-white">
            <svg viewBox="0 0 ${gridSize * 14 + 20} ${gridSize * 14 + 20}" class="w-44 h-44">${cells.join("")}</svg>
          </div>
          <div class="text-xs font-black text-sky-950">${stationDisplayName(st)}</div>
          <div class="text-[11px] font-mono bg-slate-100 px-3 py-1.5 rounded-xl break-all">${deepUrl}</div>
          <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-sky-950 text-white text-xs font-bold">${t("printBtn")}</button>
        </div>
        `
      );
    }

          <div>
            <label class="block text-xs font-extrabold text-slate-700 mb-1">${state.lang === "ar" ? "حالة الطلمبات (الحرارة والصوت)" : "Pumps (Heat & Sound)"}</label>
            <input id="rPumpState" value="${state.lang === "ar" ? "حرارة طبيعية وصوت هادئ" : "Normal heat & quiet sound"}" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold" />
          </div>

            <input id="rShiftNotes" value="${state.lang === "ar" ? "النظافة جيدة ولا توجد أعطال" : "Clean skid, no faults"}" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold" />

            <input id="rMeter8Am" type="number" value="${st.last8AmMeter + 850}" oninput="recalcLiveReadingMetrics()" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs font-bold" />

    function recalcLiveReadingMetrics() {
      const st = getStationByCode(state.readingStationCode);
      let recText = "--";
      let rejTdsText = "--";
      let netText = "--";

      if (state.readingTier === "2h") {
        const feedFlow = Number(document.getElementById("rFeedFlow")?.value || 0);
        const permFlow = Number(document.getElementById("rPermFlow")?.value || 0);
        const feedTds = Number(document.getElementById("rFeedTds")?.value || 0);
        const permTds = Number(document.getElementById("rPermTds")?.value || 0);

        if (feedFlow > 0) {
          const rec = Math.min(95, Math.max(0, (permFlow / feedFlow) * 100));
          recText = `${rec.toFixed(1)}%`;
          const rejFlow = Math.max(0.1, feedFlow - permFlow);
          const rejTds = Math.max(0, ((feedFlow * feedTds) - (permFlow * permTds)) / rejFlow);
          rejTdsText = `${Math.round(rejTds).toLocaleString()} ppm`;
        }

        const exceedPanel = document.getElementById("vesselExceedPanel");
        if (permTds > st.maxPermTds) {
          exceedPanel.classList.remove("hidden");
          const vCount = st.vessels || 6;
          document.getElementById("vesselInputsGrid").innerHTML = Array.from({ length: vCount }, (_, idx) => `
            <div class="bg-white rounded-xl p-2 border border-rose-300">
              <label class="block text-[11px] font-black text-rose-900">Vessel #${idx + 1}</label>
              <input type="number" required placeholder="ppm" class="vessel-tds-input mt-1 w-full px-2 py-1 rounded-lg border border-rose-300 text-xs font-bold" />
            </div>
          `).join("");
        } else {
          exceedPanel.classList.add("hidden");
        }
      }

      if (state.readingTier === "8am") {
        const meterNow = Number(document.getElementById("rMeter8Am")?.value || st.last8AmMeter);
        const net = Math.max(0, meterNow - st.last8AmMeter);
        netText = `${net.toLocaleString()} m³`;
      }

      document.getElementById("calcRecoveryVal").textContent = recText;
      document.getElementById("calcRejectTdsVal").textContent = rejTdsText;
      document.getElementById("calcDailyNetVal").textContent = netText;
    }

    function captureGpsLocation() {
      if (!navigator.geolocation) {
        state.gpsText = "GPS: 30.2960° N, 31.7420° E (Manual)";
        document.getElementById("gpsStatusLabel").textContent = state.gpsText;
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          state.gpsText = `${pos.coords.latitude.toFixed(4)}, ${pos.coords.longitude.toFixed(4)}`;
          document.getElementById("gpsStatusLabel").textContent = `📍 ${state.gpsText}`;
        },
        () => {
          state.gpsText = "30.2960, 31.7420 (Fallback)";
          document.getElementById("gpsStatusLabel").textContent = `📍 ${state.gpsText}`;
        }
      );
    }

    function handlePhotoSelected(e) {
      const file = e.target.files && e.target.files[0];
      state.photoName = file ? file.name : "";
      document.getElementById("photoStatusLabel").textContent = state.photoName ? `📷 ${state.photoName}` : "";
    }

    function skipVerificationMedia() {
      state.gpsText = "Skipped";
      state.photoName = "Skipped";
      document.getElementById("photoFileInput").value = "";
      document.getElementById("gpsStatusLabel").textContent = state.lang === "ar" ? "تم تخطي GPS" : "GPS skipped";
      document.getElementById("photoStatusLabel").textContent = state.lang === "ar" ? "تم تخطي الصورة" : "Photo skipped";
    }

    function saveReadingEntry(e) {
      e.preventDefault();
      const st = getStationByCode(state.readingStationCode);
      const vesselInputs = Array.from(document.querySelectorAll(".vessel-tds-input"));
      let vesselValues = [];
      if (vesselInputs.length > 0) {
        vesselValues = vesselInputs.map(inp => inp.value.trim());
        if (vesselValues.some(v => v === "")) {
          showToast(state.lang === "ar" ? "برجاء إدخال أملاح جميع الفيازل عند تجاوز الحد" : "Please enter TDS for every vessel on exceedance", "error");
          return;
        }
      }

      let summary = "";
      if (state.readingTier === "2h") {
        const perm = Number(document.getElementById("rPermTds").value);
        summary = `Perm TDS: ${perm} ppm | Rec: ${document.getElementById("calcRecoveryVal").textContent} | Rej: ${document.getElementById("calcRejectTdsVal").textContent}`;
        if (vesselValues.length) summary += ` | Vessels: [${vesselValues.join(", ")}]`;
      } else if (state.readingTier === "8am") {
        const meterNow = Number(document.getElementById("rMeter8Am").value);
        const net = Math.max(0, meterNow - st.last8AmMeter);
        st.last8AmMeter = meterNow;
        st.actual = net;
        summary = `8:00 AM Meter: ${meterNow} | Net Today: ${net} m³`;
      } else if (state.readingTier === "shift") {
        summary = `${document.getElementById("rPumpState").value} | pH ${document.getElementById("rPh").value} | Cl2 ${document.getElementById("rChlorine").value}`;
      } else if (state.readingTier === "weekly") {
        summary = `SDI: ${document.getElementById("rSdi").value} | ${document.getElementById("rCipWash").value}`;
      } else {
        summary = `Rejection: ${document.getElementById("rSaltRejection").value}% | ${document.getElementById("rMonthlyInv").value}`;
      }

      const entry = {
        id: "rd-" + Date.now(),
        stationCode: st.code,
        tier: state.readingTier,
        author: state.session ? state.session.user.name : "User",
        savedAt: Date.now(),
        summary,
        gps: state.gpsText || "—",
        photo: state.photoName || "—"
      };

      state.readings.unshift(entry);
      state.gpsText = "";
      state.photoName = "";
      document.getElementById("photoFileInput").value = "";
      document.getElementById("gpsStatusLabel").textContent = "";
      document.getElementById("photoStatusLabel").textContent = "";

      showToast(state.lang === "ar" ? "تم حفظ القراءة وبدء عداد القفل (15 دقيقة)" : "Reading saved — 15-minute edit window started", "success");
      renderReadingsHistory();
      renderHeroKpis();
    }

    function renderReadingsHistory() {
      const list = document.getElementById("readingsHistoryList");
      const filtered = state.readings.filter(r => r.stationCode === state.readingStationCode);
      if (!filtered.length) {
        list.innerHTML = `<div class="text-xs text-slate-500 text-center py-6">${state.lang === "ar" ? "لا توجد قراءات مسجلة لهذه المحطة بعد." : "No readings saved yet for this station."}</div>`;
        return;
      }

      const now = Date.now();
      const fifteenMinMs = 15 * 60 * 1000;

      list.innerHTML = filtered.map(r => {
        const elapsed = now - r.savedAt;
        const canEdit = elapsed <= fifteenMinMs;
        const minsLeft = Math.max(0, Math.ceil((fifteenMinMs - elapsed) / 60000));
        return `
          <div class="rounded-2xl border border-slate-200 bg-white p-3.5 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-xs">
            <div>
              <div class="flex items-center gap-2 flex-wrap">
                <span class="px-2 py-0.5 rounded-md bg-sky-950 text-cyan-200 font-black">${r.stationCode}</span>
                <span class="px-2 py-0.5 rounded-md bg-cyan-100 text-cyan-900 font-extrabold">${r.tier}</span>
                <span class="px-2 py-0.5 rounded-full font-bold ${canEdit ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"}">
                  ${canEdit ? `${t("editableBadge")} (${minsLeft}m)` : t("lockedBadge")}
                </span>
              </div>
              <div class="font-bold text-slate-800 mt-1.5">${r.summary}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">${r.author} • GPS: ${r.gps} • Photo: ${r.photo}</div>
            </div>
            ${canEdit ? `<button onclick="editReadingSummary('${r.id}')" class="px-3 py-1.5 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-black shrink-0">${t("editBtn")}</button>` : ""}
          </div>
        `;
      }).join("");
    }

    function editReadingSummary(id) {
      const r = state.readings.find(item => item.id === id);
      if (!r) return;
      if (Date.now() - r.savedAt > 15 * 60 * 1000) {
        showToast(t("lockedBadge"), "error");
        renderReadingsHistory();
        return;
      }
      const nextSummary = prompt(state.lang === "ar" ? "تعديل ملخص القراءة (خلال 15 دقيقة):" : "Edit reading summary (within 15m):", r.summary);
      if (nextSummary) {
        r.summary = nextSummary;
        showToast(state.lang === "ar" ? "تم تحديث القراءة بنجاح" : "Reading updated", "success");
        renderReadingsHistory();
      }
    }

    // =========================================================================
    // 10. RO ENGINEERING DESIGN CALCULATOR
    // =========================================================================
    function calculateRoDesign() {
      const sysType = document.getElementById("desSystemType").value;
      const flowCap = Math.max(10, Number(document.getElementById("desFlowCap").value || 1000));
      const opHours = Math.min(24, Math.max(1, Number(document.getElementById("desOpHours").value || 22)));
      const recPct = Math.min(90, Math.max(15, Number(document.getElementById("desRecovery").value || 42)));
      const feedTds = Math.max(50, Number(document.getElementById("desFeedTds").value || 35000));
      const tempC = Number(document.getElementById("desTemp").value || 25);
      const membFlux = Math.max(5, Number(document.getElementById("desMembFlux").value || 28));
      const elemsPerVessel = Math.max(1, Number(document.getElementById("desElemsPerVessel").value || 7));
      const useEri = document.getElementById("desUseEri").checked;
      const useChem = document.getElementById("desUseChem").checked;

      const recFrac = recPct / 100;
      const feedFlowDay = flowCap / recFrac;
      const rejectFlowDay = Math.max(0, feedFlowDay - flowCap);
      const feedFlowHr = feedFlowDay / opHours;
      const permFlowHr = flowCap / opHours;
      const rejectFlowHr = rejectFlowDay / opHours;

      const saltRejection = sysType === "SWRO" ? 0.997 : 0.994;
      const permTds = Math.round(feedTds * (1 - saltRejection));
      const rejectTds = rejectFlowDay > 0 ? Math.round((feedFlowDay * feedTds - flowCap * permTds) / rejectFlowDay) : feedTds;

      const totalElements = Math.max(1, Math.ceil(flowCap / membFlux));
      const totalVessels = Math.max(1, Math.ceil(totalElements / elemsPerVessel));
      const stage1Vessels = Math.max(1, Math.round(totalVessels * 0.6));
      const stage2Vessels = Math.max(0, totalVessels - stage1Vessels);
      const arrayPattern = stage2Vessels > 0 ? `${stage1Vessels} : ${stage2Vessels}` : `${totalVessels} : 0`;

      // Temp correction factor around 25C
      const tcf = Math.exp(0.025 * (tempC - 25));
      const baseKwPerM3 = sysType === "SWRO" ? (useEri ? 3.4 : 5.6) : sysType === "BWRO" ? 1.4 : 1.7;
      const specEnergy = Number((baseKwPerM3 / Math.max(0.75, tcf)).toFixed(2));
      const hpPumpKw = Math.round(permFlowHr * (sysType === "SWRO" ? 2.4 : 0.9));
      const feedPumpKw = Math.max(2, Math.round(feedFlowHr * 0.22));

      const antiscalantKgDay = useChem ? Number((feedFlowDay * 0.0035).toFixed(2)) : 0;
      const smbsKgDay = useChem ? Number((feedFlowDay * 0.0018).toFixed(2)) : 0;
      const acidCausticKgDay = useChem ? Number((feedFlowDay * 0.004).toFixed(2)) : 0;
      const naoclKgDay = useChem ? Number((feedFlowDay * 0.0025).toFixed(2)) : 0;

      const capexK = Math.round((flowCap * (sysType === "SWRO" ? 1.35 : 0.68)) + (totalVessels * 4.5));
      const opexDayEgp = Math.round(flowCap * specEnergy * 2.1 + (useChem ? flowCap * 1.4 : 0));

      window.__latestDesignSummary = `${sysType} ${flowCap} m³/d | Vessels: ${totalVessels} (${arrayPattern}) | Rej TDS: ${rejectTds} ppm | SEC: ${specEnergy} kWh/m³ | CapEx ~${capexK}k EGP`;

      const cards = [
        [state.lang === "ar" ? "تدفق الفيد / الريجكت" : "Feed / Reject Flow", `${feedFlowHr.toFixed(1)} / ${rejectFlowHr.toFixed(1)} m³/h (Perm ${permFlowHr.toFixed(1)} m³/h)`],
        [state.lang === "ar" ? "أملاح المنتج والريجكت" : "Permeate & Reject TDS", `Perm ~${permTds} ppm | Reject ~${rejectTds.toLocaleString()} ppm`],
        [state.lang === "ar" ? "الأغشية والفيازل والأنساق" : "Elements, Vessels & Array", `${totalElements} Elem • ${totalVessels} Vessels • Array ${arrayPattern}`],
        [state.lang === "ar" ? "الطلمبات والاستهلاك النوعي" : "Pumps & Specific Energy", `HP ~${hpPumpKw} kW | Feed ~${feedPumpKw} kW | SEC ${specEnergy} kWh/m³`],
        [state.lang === "ar" ? "الكيماويات اليومية (kg/d)" : "Daily Dosing (kg/day)", useChem ? `AS ${antiscalantKgDay} • SMBS ${smbsKgDay} • pH ${acidCausticKgDay} • NaOCl ${naoclKgDay}` : "Disabled"],
        [state.lang === "ar" ? "التكلفة التقديرية (CapEx / OpEx)" : "Est. CapEx & Daily OpEx", `CapEx ~${capexK.toLocaleString()}k EGP | OpEx ~${opexDayEgp.toLocaleString()} EGP/d`]
      ];

      document.getElementById("designResultsGrid").innerHTML = cards.map(([k, v]) => `
        <div class="rounded-xl bg-white/10 border border-white/15 p-3">
          <div class="text-[11px] text-cyan-200 font-semibold">${k}</div>
          <div class="text-xs font-black text-white mt-1">${v}</div>
        </div>
      `).join("");
    }

    function exportDesignToProposal() {
      if (!window.__latestDesignSummary) calculateRoDesign();
      state.proposals.unshift({
        id: "PR-" + Math.floor(200 + Math.random() * 700),
        title: window.__latestDesignSummary,
        type: "Technical/Financial Proposal",
        valueK: 850,
        status: "Draft Exported"
      });
      showToast(state.lang === "ar" ? "تم ترحيل التصميم إلى سجل العروض الفنية والمالية" : "Exported design to Proposals list", "success");
    }

    // =========================================================================
    // 11. INTERACTIVE STATION LAYOUT / P&ID
    // =========================================================================
    function renderPidCanvas() {
      const sel = document.getElementById("pidStationSelect");
      const isOp = state.session && state.session.role === "operator";
      const list = isOp ? state.stations.filter(s => s.code === state.session.stationCode) : state.stations;
      const currentCode = isOp ? state.session.stationCode : (sel.value || list[0].code);

      sel.innerHTML = list.map(s => `<option value="${s.code}" ${s.code === currentCode ? "selected" : ""}>${stationDisplayName(s)}</option>`).join("");
      sel.disabled = isOp;

      if (!state.pidNodes[currentCode]) {
        const st = getStationByCode(currentCode);
        state.pidNodes[currentCode] = [
          { id: "N1", name: "Feed / Intake", pressure: "2.0 bar", tds: st.type === "SWRO" ? "38,000 ppm" : "2,200 ppm", note: "Stage 1" },
          { id: "N2", name: "Pre-Treatment", pressure: "1.6 bar", tds: st.type === "SWRO" ? "38,000 ppm" : "2,200 ppm", note: "Filtration" },
          { id: "N3", name: `${st.type} Skid`, pressure: st.type === "SWRO" ? "57.0 bar" : "15.0 bar", tds: `${st.maxPermTds - 80} ppm`, note: "Membranes" }
        ];
      }

      const nodes = state.pidNodes[currentCode];
      if (!nodes.some(n => n.id === state.selectedPidNodeId)) {
        state.selectedPidNodeId = nodes[0]?.id || "";
      }

      document.getElementById("pidFlowNodes").innerHTML = nodes.map((n, idx) => `
        <div onclick="inspectPidNode('${currentCode}', '${n.id}')" class="cursor-pointer rounded-2xl p-3.5 border-2 transition ${
          state.selectedPidNodeId === n.id ? "border-cyan-700 bg-white shadow-md" : "border-slate-200 bg-white/80 hover:border-cyan-500"
        }">
          <div class="flex items-center justify-between text-[11px] font-extrabold text-cyan-800">
            <span>#${idx + 1}</span>
            <span>${n.pressure}</span>
          </div>
          <div class="text-sm font-black text-sky-950 mt-1">${n.name}</div>
          <div class="text-[11px] text-slate-600 mt-1">TDS: <b>${n.tds}</b></div>
        </div>
      `).join("");

      const activeNode = nodes.find(n => n.id === state.selectedPidNodeId);
      document.getElementById("pidSelectedInspector").innerHTML = activeNode ? `
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <span class="font-black text-sky-950 text-sm">${activeNode.name}</span>
            <span class="mx-2 text-slate-400">|</span>
            <span>Pressure: <b>${activeNode.pressure}</b></span>
            <span class="mx-2 text-slate-400">|</span>
            <span>TDS: <b>${activeNode.tds}</b></span>
            <span class="mx-2 text-slate-400">|</span>
            <span>Note: <b>${activeNode.note}</b></span>
          </div>
          <button onclick="editPidNode('${currentCode}', '${activeNode.id}')" class="px-3 py-1.5 rounded-xl bg-cyan-700 text-white font-bold">${t("editBtn")}</button>
        </div>
      ` : "";
    }

    function inspectPidNode(code, id) {
      state.selectedPidNodeId = id;
      renderPidCanvas();
    }

    function addPidNode() {
      const code = document.getElementById("pidStationSelect").value;
      const name = prompt(state.lang === "ar" ? "اسم المعدة أو النقطة الجديدة:" : "New node / equipment name:", "Booster / CIP Line");
      if (!name) return;
      state.pidNodes[code].push({
        id: "N-" + Date.now(),
        name,
        pressure: "4.0 bar",
        tds: "—",
        note: "Added on P&ID"
      });
      renderPidCanvas();
    }

    function editPidNode(code, id) {
      const node = state.pidNodes[code].find(n => n.id === id);
      if (!node) return;
      const pressure = prompt("Pressure:", node.pressure);
      if (pressure) node.pressure = pressure;
      const tds = prompt("TDS:", node.tds);
      if (tds) node.tds = tds;
      const note = prompt("Note:", node.note);
      if (note) node.note = note;
      renderPidCanvas();
    }

    // =========================================================================
    // 12. CONTRACTS, ROG, INVOICES & CITYWATER BREAKDOWN TEAM
    // =========================================================================
    function renderExtraTab() {
      document.getElementById("proposalsList").innerHTML = state.proposals.map(p => `
        <div class="rounded-2xl border border-slate-200 bg-white p-4 flex flex-col justify-between gap-2">
          <div>
            <div class="flex items-center justify-between text-xs">
              <span class="font-black text-sky-950">${p.id} • ${p.type}</span>
              <span class="px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800 font-bold text-[11px]">${p.status}</span>
            </div>
            <div class="text-xs font-bold text-slate-800 mt-1.5">${p.title}</div>
          </div>
          <div class="text-xs font-black text-cyan-800">${Number(p.valueK || 0).toLocaleString()}k EGP</div>
        </div>
      `).join("");

      document.getElementById("breakdownGrid").innerHTML = BREAKDOWN_TEAM.map(m => `
        <div class="rounded-2xl border border-cyan-800/15 bg-white p-4 space-y-1.5">
          <div class="text-[11px] font-extrabold text-cyan-800">${state.lang === "ar" ? m.roleAr : m.roleEn}</div>
          <div class="text-sm font-black text-sky-950">${m.lead}</div>
          <p class="text-xs text-slate-600 leading-relaxed">${state.lang === "ar" ? m.scopeAr : m.scopeEn}</p>
        </div>
      `).join("");
    }

    function addProposalOrContract() {
      const title = prompt(state.lang === "ar" ? "عنوان العرض أو العقد أو طلب ROG:" : "Proposal / Contract / ROG title:");
      if (!title) return;
      const valueK = Number(prompt(state.lang === "ar" ? "القيمة بالألف جنيه:" : "Value (k EGP):", "250") || 250);
      state.proposals.unshift({
        id: "PR-" + Math.floor(300 + Math.random() * 600),
        title,
        type: "Contract / ROG",
        valueK,
        status: "Active"
      });
      renderExtraTab();
      showToast(state.lang === "ar" ? "تمت الإضافة" : "Added", "success");
    }

    // =========================================================================
    // 13. DUAL-ROLE AI CHATBOT + WHATSAPP ESCALATION (01061926639)
    // =========================================================================
    function renderAiTab() {
      const prompts = state.aiMode === "params"
        ? [
            state.lang === "ar" ? "تحليل أملاح والريكفري وCIP" : "Analyze TDS, recovery & CIP",
            state.lang === "ar" ? "مراجعة تكلفة المحطات والربحية" : "Review station costs & margin"
          ]
        : [
            state.lang === "ar" ? "إزاي أعدل قراءة خلال 15 دقيقة؟" : "How to edit a reading within 15m?",
            state.lang === "ar" ? "إزاي أدخل أملاح الفيازل عند التجاوز؟" : "How to enter vessel TDS on exceedance?"
          ];

      document.getElementById("aiQuickPrompts").innerHTML = prompts.map(q => `
        <button type="button" onclick="askAiPrompt('${q.replace(/'/g, "\\'")}')" class="px-3 py-1.5 rounded-xl bg-cyan-50 hover:bg-cyan-100 border border-cyan-200 text-xs font-bold text-cyan-950">${q}</button>
      `).join("");

      document.getElementById("aiUserInput").placeholder = state.aiMode === "params"
        ? (state.lang === "ar" ? "اسأل عن البرامتر أو CIP أو التكاليف..." : "Ask about parameters, CIP, or costs...")
        : (state.lang === "ar" ? "اسأل عن طريقة استخدام التطبيق..." : "Ask how to use WOMS V8.0...");

      if (!state.aiMessages.length) {
        state.aiMessages.push({
          sender: "ai",
          text: state.lang === "ar"
            ? "أهلاً بك في مساعد CITY WATER الذكي. يمكنني (1) تحليل البرامتر والـ CIP والتكاليف، أو (2) مساعدتك في استخدام التطبيق وتوجيهك لواتساب 01061926639 عند الحاجة."
            : "Welcome to the CITY WATER AI Chatbot. I can (1) analyze parameters, CIP & costs, or (2) guide app usage and escalate to WhatsApp 01061926639 if needed."
        });
      }

      document.getElementById("aiChatMessages").innerHTML = state.aiMessages.map(m => `
        <div class="rounded-2xl p-3 max-w-2xl ${
          m.sender === "user" ? "bg-sky-950 text-white ms-auto" : "bg-white border border-slate-200 text-slate-800 me-auto"
        }">${m.text}</div>
      `).join("");
      const box = document.getElementById("aiChatMessages");
      box.scrollTop = box.scrollHeight;
    }

    function setAiMode(mode) {
      state.aiMode = mode;
      document.getElementById("btnAiModeParams").className = "px-3.5 py-2 rounded-xl text-xs font-extrabold " +
        (mode === "params" ? "bg-cyan-700 text-white" : "bg-slate-200 text-slate-800");
      document.getElementById("btnAiModeHelp").className = "px-3.5 py-2 rounded-xl text-xs font-extrabold " +
        (mode === "help" ? "bg-cyan-700 text-white" : "bg-slate-200 text-slate-800");
      renderAiTab();
    }

    function askAiPrompt(q) {
      document.getElementById("aiUserInput").value = q;
      sendAiChatMessage(new Event("submit"));
    }

    function sendAiChatMessage(e) {
      e.preventDefault();
      const inp = document.getElementById("aiUserInput");
      const q = inp.value.trim();
      if (!q) return;
      state.aiMessages.push({ sender: "user", text: q });

      const inactiveList = state.stations.filter(s => !s.active).map(s => s.code).join(", ") || "None";
      let reply = "";
      if (state.aiMode === "params") {
        reply = state.lang === "ar"
          ? `تحليل فوري: إجمالي المحطات ${state.stations.length} (المتوقفة حالياً: ${inactiveList}). يُنصح بمراقبة فرق الضغط ومعدل التدفق للكشف المبكر عن الحاجة إلى غسيل كيميائي (CIP) ومراجعة تكلفة التشغيل.`
          : `Parameter Analysis: ${state.stations.length} total stations (currently inactive: ${inactiveList}). Monitor differential pressure and permeate flow trends for timely CIP planning and cost control.`;
      } else {
        reply = state.lang === "ar"
          ? `دليل الاستخدام: 1) يدخل المشغل برقم هاتفه وباسورد 1234 لمحطته فقط. 2) بعد حفظ القراءة يتاح التعديل خلال 15 دقيقة فقط. 3) عند تجاوز حد أملاح المنتج يُفتح إدخال أملاح كل فيزل. إذا لم يُحل الإشكال، اضغط زر "واتساب 01061926639".`
          : `App Guide: 1) Operators sign in with phone + password (default 1234) for their assigned station. 2) Readings remain editable for 15 minutes after saving. 3) Exceeding permeate TDS requires per-vessel TDS. If unresolved, click "WhatsApp 01061926639".`;
      }

      state.aiMessages.push({ sender: "ai", text: reply });
      inp.value = "";
      renderAiTab();
    }

    function escalateToWhatsapp() {
      const user = state.session ? state.session.user.name : "Guest";
      const station = state.session?.stationCode || state.readingStationCode || "General";
      const issue = document.getElementById("aiUserInput").value.trim() || (state.lang === "ar" ? "محتاج مساعدة فنية في التطبيق" : "Need assistance with WOMS V8.0");
      const msg = encodeURIComponent(`CITY WATER - WOMS V8.0 Support\nUser: ${user}\nStation: ${station}\nIssue: ${issue}`);
      window.open(`https://wa.me/201061926639?text=${msg}`, "_blank", "noopener,noreferrer");
    }

    // =========================================================================
    // 14. VERTICAL NEWS / PROJECTS / REWARDS / REGULATIONS SIDEBAR
    // =========================================================================
    function toggleNewsSidebar() {
      state.newsOpen = !state.newsOpen;
      document.getElementById("newsSidebar").classList.toggle("hidden", !state.newsOpen);
    }

    function renderNewsSidebar() {
      const cats = [
        { id: "ALL", ar: "الكل", en: "All" },
        { id: "project", ar: "مشاريع", en: "Projects" },
        { id: "reward", ar: "مكافآت", en: "Rewards" },
        { id: "rule", ar: "لوائح", en: "Rules" },
        { id: "news", ar: "أخبار", en: "News" }
      ];

      document.getElementById("newsCategoryFilters").innerHTML = cats.map(c => `
        <button onclick="setNewsFilter('${c.id}')" class="px-2.5 py-1 rounded-full text-[11px] font-extrabold transition ${
          state.newsFilter === c.id ? "bg-sky-950 text-white" : "bg-slate-100 text-slate-700 hover:bg-slate-200"
        }">${state.lang === "ar" ? c.ar : c.en}</button>
      `).join("");

      const items = state.news.filter(n => state.newsFilter === "ALL" || n.cat === state.newsFilter);
      document.getElementById("newsFeedList").innerHTML = items.map(n => `
        <article class="rounded-2xl border border-slate-200 bg-white p-3 space-y-1.5">
          <div class="flex items-center justify-between text-[10px] font-bold text-slate-500">
            <span class="px-2 py-0.5 rounded bg-amber-100 text-amber-900 font-black uppercase">${n.cat}</span>
            <span>${n.date}</span>
          </div>
          <h4 class="text-xs font-black text-sky-950 leading-snug">${state.lang === "ar" ? n.titleAr : n.titleEn}</h4>
          <p class="text-[11px] text-slate-600 leading-relaxed">${state.lang === "ar" ? n.bodyAr : n.bodyEn}</p>
          <div class="flex justify-end gap-2 pt-1">
            <button onclick="editNewsItem('${n.id}')" class="text-[10px] font-bold text-cyan-800 hover:underline">${t("editBtn")}</button>
            <button onclick="deleteNewsItem('${n.id}')" class="text-[10px] font-bold text-rose-700 hover:underline">${t("deleteBtn")}</button>
          </div>
        </article>
      `).join("");
    }

    function setNewsFilter(cat) {
      state.newsFilter = cat;
      renderNewsSidebar();
    }

    function openAddNewsModal() {
      openModal(
        state.lang === "ar" ? "إضافة تحديث / خبر / مكافأة / لائحة" : "Add News / Project / Reward / Rule",
        `
        <label class="block font-bold">${state.lang === "ar" ? "التصنيف" : "Category"}
          <select id="mNewsCat" class="mt-1 w-full px-3 py-2 rounded-xl border font-bold">
            <option value="news">News / أخبار</option>
            <option value="project">Project / مشروع جديد</option>
            <option value="reward">Reward / مكافآت وجوائز</option>
            <option value="rule">Rule / لائحة جديدة</option>
          </select>
        </label>
        <label class="block font-bold">${state.lang === "ar" ? "العنوان" : "Title"}
          <input id="mNewsTitle" class="mt-1 w-full px-3 py-2 rounded-xl border font-bold" />
        </label>
        <label class="block font-bold">${state.lang === "ar" ? "التفاصيل" : "Details"}
          <textarea id="mNewsBody" rows="3" class="mt-1 w-full px-3 py-2 rounded-xl border font-bold"></textarea>
        </label>
        <button onclick="confirmAddNews()" class="w-full py-2.5 rounded-xl bg-cyan-700 text-white font-black">${state.lang === "ar" ? "نشر التحديث" : "Publish"}</button>
        `
      );
    }

    function confirmAddNews() {
      const cat = document.getElementById("mNewsCat").value;
      const title = document.getElementById("mNewsTitle").value.trim();
      const body = document.getElementById("mNewsBody").value.trim();
      if (!title || !body) return;
      state.news.unshift({
        id: "n-" + Date.now(),
        cat,
        titleAr: title,
        titleEn: title,
        bodyAr: body,
        bodyEn: body,
        date: new Date().toISOString().slice(0, 10)
      });
      closeModal();
      renderNewsSidebar();
      showToast(state.lang === "ar" ? "تم نشر التحديث" : "Published", "success");
    }

    function editNewsItem(id) {
      const item = state.news.find(n => n.id === id);
      if (!item) return;
      const nextTitle = prompt(state.lang === "ar" ? "تعديل العنوان:" : "Edit title:", state.lang === "ar" ? item.titleAr : item.titleEn);
      if (nextTitle) {
        item.titleAr = nextTitle;
        item.titleEn = nextTitle;
      }
      const nextBody = prompt(state.lang === "ar" ? "تعديل النص:" : "Edit text:", state.lang === "ar" ? item.bodyAr : item.bodyEn);
      if (nextBody) {
        item.bodyAr = nextBody;
        item.bodyEn = nextBody;
      }
      renderNewsSidebar();
    }

    function deleteNewsItem(id) {
      state.news = state.news.filter(n => n.id !== id);
      renderNewsSidebar();
    }

    // =========================================================================
    // 15. MODAL & MASTER RENDER LOOP
    // =========================================================================
    function openModal(title, bodyHtml) {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = bodyHtml;
      const mb = document.getElementById("modalBackdrop");
      mb.classList.remove("hidden");
      mb.classList.add("flex");
    }

    function closeModal() {
      const mb = document.getElementById("modalBackdrop");
      mb.classList.add("hidden");
      mb.classList.remove("flex");
    }

    function renderAll() {
      applyStaticTranslations();
      renderHeroKpis();
      renderOpQuickChips();
      renderNewsSidebar();
      renderWorkspace();
    }

    // Check optional ?station=SWRO-01 query param on load
    (function initApp() {
      const params = new URLSearchParams(window.location.search);
      const qStation = params.get("station");
      if (qStation && state.stations.some(s => s.code === qStation.toUpperCase())) {
        state.readingStationCode = qStation.toUpperCase();
        switchAuthTab("operator");
      }
      renderAll();
    })();
  </script>
</body>
